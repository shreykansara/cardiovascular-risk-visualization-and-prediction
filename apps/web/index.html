<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfusion3D | Coronary Artery Disease Risk Assessment</title>
    <meta name="description" content="Estimates the likelihood of coronary artery narrowing from clinical measurements and shows the result on a 3D heart." />
    <!-- OpenGraph -->
    <meta property="og:title" content="Perfusion3D | Coronary Artery Disease Risk Assessment" />
    <meta property="og:description" content="Estimates the likelihood of coronary artery narrowing from clinical measurements and shows the result on a 3D heart." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Perfusion3D | Coronary Artery Disease Risk Assessment" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230B5CAD' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M22 12h-4l-3 9L9 3l-3 9H2'/></svg>" />
    <script>
      (function() {
        try {
          var pref = localStorage.getItem('perfusion3d-theme') || 'system';
          var theme = pref;
          if (pref === 'system' || !pref) {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body class="bg-page text-text font-sans antialiased min-h-screen">
    <div id="root" class="min-h-screen flex flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
